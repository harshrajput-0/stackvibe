<svg width="440" height="120" viewBox="0 0 440 120" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Icon: stacked layers with a "vibe" wave cut through, monochrome -->
  <g transform="translate(10, 15)">
    <!-- back layer -->
    <path d="M45 4 L86 24 L45 44 L4 24 Z" fill="#111111" opacity="0.25"/>
    <!-- middle layer -->
    <path d="M45 26 L86 46 L45 66 L4 46 Z" fill="#111111" opacity="0.55"/>
    <!-- front layer with wave notch to suggest "vibe" -->
    <path d="M45 48 L86 68 L45 88 L4 68 Z" fill="#111111"/>
    <path d="M18 68 Q27 58 36 68 T54 68 T72 68"
          fill="none" stroke="#FFFFFF" stroke-width="3.2"
          stroke-linecap="round" opacity="0.95"/>
  </g>

  <!-- Wordmark -->
  <text x="115" y="66"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="40" font-weight="700" letter-spacing="0.5"
        fill="#111111">Stack<tspan font-weight="400">Vibe</tspan></text>

  <!-- tagline -->
  <text x="117" y="88"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="13" font-weight="500" letter-spacing="2.5"
        fill="#8A8A8A">BUILD IN SYNC</text>
</svg>
